# Podcast sources. Only shows whose RSS feed carries a <podcast:transcript> tag
# (timestamped VTT/SRT) are fully automatic. See README for how to add more.

# public address of the site (used in daily post links)
site_url: https://myfan729.github.io/podcast-study/

# the owner's blogs: words/expressions that already have a post get a "블로그에서 자세히 보기" link
blogs:
  - id: oorange0123
    name: 지구별여행자

# What goes out to the chat, and when (KST). For every posting occasion the pipeline makes exactly `count`
# episodes in the hours before: the newest new episode of each show in `shows` (in that order), then — for places
# those leave empty — `fallback` shows, then an older episode from the `catalog` archive. A show that usually
# publishes shortly before the posting time (learned from its feed, per weekday) keeps its place until 15 minutes
# after it. The KakaoTalk bot posts each message at `at` and gives up after `until`.
schedule:
  morning:
    at: "07:00"
    until: "12:00"
    count: 2
    label: "🌅 아침 팟캐스트"
    shows: [daybreak-us, big-take]                       # news briefing + one-story deep dive
    fallback: [trumponomics, everybodys-business, zero]  # weekends: weekly Bloomberg shows
  evening:
    at: "21:00"
    until: "23:30"
    count: 1
    label: "🌙 하루 마무리 팟캐스트"
    shows: [think-fast-talk-smart, stuff-you-should-know] # new TFTS (Mon/Thu night) → Tue/Fri, Short Stuff (Wed)
    catalog: [think-fast-talk-smart]                     # other evenings: an earlier TFTS episode

defaults:
  max_minutes: 40          # skip episodes longer than this (e.g. Big Take "Weekend Listen")
  backfill: 3              # on first run, process the newest N eligible episodes per show
  transcript_retry_days: 4 # keep retrying episodes whose transcript tag appears later
  max_age_days: 14         # ignore archive items older than this (first run still backfills the newest N)
  min_minutes: 6           # trailers / promos
  language: en

shows:
  - slug: big-take
    name: Big Take
    publisher: Bloomberg
    color: "#1f5fbf"
    feed: https://www.omnycontent.com/d/playlist/e73c998e-6e60-432f-8610-ae210140c5b1/825d4e29-b616-46f4-afd7-ae2b0013005c/8b1dd624-a026-43e9-8b57-ae2b00130066/podcast.rss
    homepage: https://www.bloomberg.com/podcasts/series/big-take
    # Omny labels speakers generically ("Speaker 1"); the study pack maps them to names.
    speaker_labels: generic
    style: "Narrated business/economics news story with reporter interviews; ~15 min; weekdays."

  - slug: big-take-asia
    name: Big Take Asia
    enabled: false            # every episode is also published in the Big Take feed
    publisher: Bloomberg
    color: "#0f8a7a"
    feed: https://www.omnycontent.com/d/playlist/e73c998e-6e60-432f-8610-ae210140c5b1/55b5c41e-b796-493d-829e-b16201392082/ed303395-bd29-403a-98d9-b16201396959/podcast.rss
    homepage: https://www.bloomberg.com/podcasts/series/big-take-asia
    speaker_labels: generic
    style: "Weekly Asia business & policy story told by host Oanh Ha with Bloomberg reporters; ~15 min."

  - slug: think-fast-talk-smart
    name: Think Fast, Talk Smart
    publisher: Stanford GSB
    color: "#a8322d"
    feed: https://feeds.transistor.fm/think-fast-talk-smart-communication-techniques
    homepage: https://www.fastersmarter.io/
    # Recent Transistor VTT has no speaker tags (the study pack assigns speakers per segment); episodes from
    # 2024–2025 (the evening archive) prefix lines with "Matt Abrahams: …" — auto handles both.
    speaker_labels: auto
    style: "Communication-skills interview show hosted by Matt Abrahams (Stanford GSB); ~15-25 min; Mon & Thu. Contains a ~1 min sponsor read."

  - slug: daybreak-us
    name: Bloomberg Daybreak
    publisher: Bloomberg
    color: "#5b3fd1"
    feed: https://www.omnycontent.com/d/playlist/e73c998e-6e60-432f-8610-ae210140c5b1/d15648c4-cee0-4e99-a5ca-af80014d921d/65ce2954-d8a8-4c66-9f42-af80014d923e/podcast.rss
    speaker_labels: generic
    title_exclude: "^bonus"     # narrative bonus series episodes (part N of a story) — not a news briefing
    style: "Bloomberg's morning news briefing (US edition): an anchor runs through the day's top business, markets and world headlines with short reporter and guest segments; ~15 min on weekdays, a longer 'Daybreak Weekend' week-ahead edition on Saturdays."

  - slug: stuff-you-should-know
    name: Stuff You Should Know
    publisher: iHeartPodcasts
    color: "#e0752d"
    feed: https://www.omnycontent.com/d/playlist/e73c998e-6e60-432f-8610-ae210140c5b1/a91018a4-ea4f-4130-bf55-ae270180c327/44710ecc-10bb-48d1-93c7-ae270180c33e/podcast.rss
    speaker_labels: generic
    title_include: "^short stuff"   # the ~12 min weekly episodes; the full ones run 45–60 min
    max_minutes: 25
    style: "'Short Stuff' episodes of Stuff You Should Know: the two longtime hosts chat casually and with lots of jokes about one quirky topic; ~12 min; weekly (Wed)."

  - slug: trumponomics
    name: Trumponomics
    publisher: Bloomberg
    color: "#b5452f"
    feed: https://www.omnycontent.com/d/playlist/e73c998e-6e60-432f-8610-ae210140c5b1/84f3c095-964f-4994-9d24-ae2b00130029/c9553948-bc39-4871-8989-ae2b00130032/podcast.rss
    speaker_labels: generic
    style: "Weekly Bloomberg conversation about the economics of US policy under President Trump, a host with Bloomberg journalists and outside experts; ~30 min."

  - slug: everybodys-business
    name: Everybody's Business
    publisher: Bloomberg
    color: "#2f7d4f"
    feed: https://www.omnycontent.com/d/playlist/e73c998e-6e60-432f-8610-ae210140c5b1/f541f9b4-77cb-45aa-bf94-b1d300e5d357/1d448cb7-e0fc-45b8-b51f-b1d300e623a7/podcast.rss
    speaker_labels: generic
    style: "Weekly Bloomberg business-culture chat show: two hosts banter about the week's business stories and talk with a guest; ~35 min."

  - slug: zero
    name: "Zero: The Climate Race"
    publisher: Bloomberg
    color: "#1e7f8c"
    feed: https://www.omnycontent.com/d/playlist/e73c998e-6e60-432f-8610-ae210140c5b1/37c6caa7-d377-4c08-b479-af9d012ed5ad/a7faefb0-28ec-4b1d-85f3-af9d012ed5c9/podcast.rss
    speaker_labels: generic
    style: "Weekly Bloomberg climate & clean-energy interview show: the host talks with one or two guests about the business and politics of decarbonisation; ~35 min."

  - slug: bbc-6-minute-english
    name: 6 Minute English
    enabled: false            # too easy for now — kept for reference
    publisher: BBC Learning English
    color: "#b80000"
    feed: https://podcasts.files.bbci.co.uk/p02pc9tn.rss
    homepage: https://www.bbc.co.uk/learningenglish/english/features/6-minute-english
    # No transcript tag in the feed; the scripted transcript is on the episode page. The pipeline
    # downloads the audio, recognises it with Whisper and aligns the text to get timestamps.
    transcript: web
    parser: bbc_le
    # the feed links to bbc.co.uk/programmes (no transcript); the Learning English page is date-coded
    page_url: "https://www.bbc.co.uk/learningenglish/english/features/6-minute-english_{year}/ep-{yymmdd}"
    # the page offers the programme itself as an ad-free https download with CORS — use it instead of
    # the podcast enclosure (which carries inserted ads and whose first redirect blocks browser fetches)
    audio_from_page: true
    # that file has no inserted ads and is the same for everyone, so cue times use the file's own clock
    # (the 18 s intro and the trailer at the end are simply not highlighted) — no sync step needed
    ad_free: true
    speaker_labels: named
    max_minutes: 10
    backfill: 2
    level: "B1-B2"
    style: "Two presenters discuss one topic in clear, simple English for learners; ~6 min; weekly. Scripted, with a vocabulary recap."
