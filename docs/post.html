<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘의 글 · Podcast Study</title>
<link rel="stylesheet" href="assets/app.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
  .card-wrap { max-width: 560px; margin: 24px auto; }
  .slot { margin: 26px 0 8px; font-size: 13.5px; color: var(--ink-3); display: flex; gap: 8px; align-items: baseline; }
  .slot b { color: var(--ink); font-size: 15px; }
  .post { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15.5px; line-height: 1.6; padding: 18px 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--sheet); }
  .actions { display: flex; gap: 8px; margin: 10px 0 18px; flex-wrap: wrap; }
  .hist { margin-top: 28px; color: var(--ink-3); font-size: 13.5px; }
  .empty { color: var(--ink-3); }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar"><div class="brand">오늘의 글</div><div class="tools"><a class="btn" href="./">목록</a></div></header>
  <div class="card-wrap">
    <div id="posts"><p class="empty">불러오는 중…</p></div>
    <p class="hist">아침 07:00(2편)과 저녁 18:00(1편)에 카톡방 봇이 자동으로 올립니다. 봇이 못 올렸을 때는 여기서 복사해 붙이면 됩니다.</p>
  </div>
</div>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const KST = 9 * 3600 * 1000;
  const day = (ms) => new Date(ms + KST).toISOString().slice(0, 10);
  const hm = (ms) => new Date(ms + KST).toISOString().slice(11, 16);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const SLOT = { morning: '아침', evening: '저녁', extra: '추가' };

  function render(posts) {
    const now = Date.now(), today = day(now);
    // today's posts, the upcoming ones, and — if there is nothing yet today — the most recent occasion
    let show = posts.filter(p => day(p.post_at_ms) === today || p.post_at_ms > now);
    if (!show.length && posts.length) { const last = posts[posts.length - 1].occasion; show = posts.filter(p => p.occasion === last); }
    if (!show.length) { $('#posts').innerHTML = '<p class="empty">아직 올라갈 글이 없습니다.</p>'; return; }
    const groups = [];
    for (const p of show) { let g = groups.find(g => g.occasion === p.occasion); if (!g) groups.push(g = { occasion: p.occasion, at: p.post_at_ms, slot: p.slot, posts: [] }); g.posts.push(p); }
    $('#posts').innerHTML = groups.map((g, gi) => `
      <div class="slot"><b>${SLOT[g.slot] || ''} ${hm(g.at)}</b><span>${day(g.at) === today ? '오늘' : day(g.at).slice(5).replace('-', '/')} · ${g.posts.length}편 · ${g.at <= now ? '게시 시각 지남' : '예정'}</span></div>
      ${g.posts.map((p, i) => `
        <div class="post" id="p${gi}-${i}">${esc(p.text)}</div>
        <div class="actions">
          <button class="btn" type="button" data-copy="p${gi}-${i}">텍스트 복사</button>
          ${navigator.share ? `<button class="btn" type="button" data-share="p${gi}-${i}">공유…</button>` : ''}
          <a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">에피소드 열기</a>
        </div>`).join('')}`).join('');
  }

  document.addEventListener('click', (e) => {
    const c = e.target.closest('[data-copy]'), s = e.target.closest('[data-share]');
    if (c) {
      const box = document.getElementById(c.dataset.copy), text = box.textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { c.textContent = '복사됨 ✓'; setTimeout(() => c.textContent = '텍스트 복사', 1500); },
        () => { const r = document.createRange(); r.selectNodeContents(box); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); });
    }
    if (s) navigator.share({ text: document.getElementById(s.dataset.share).textContent }).catch(() => {});
  });

  fetch('data/daily/queue.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(q => render(q.posts || []))
    .catch(() => fetch('data/daily/latest.json', { cache: 'no-cache' }).then(r => r.json())
      .then(card => render([{ occasion: card.id, slot: 'morning', post_at_ms: Date.parse(card.date_kst + 'T07:00:00+09:00'), text: card.text, link: card.link }]))
      .catch(e => { $('#posts').innerHTML = '<p class="empty">아직 올라갈 글이 없습니다.</p>'; }));
})();
</script>
</body>
</html>
