<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>오늘의 카드 · Podcast Study</title>
<link rel="stylesheet" href="assets/app.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
  .card-wrap { max-width: 560px; margin: 24px auto; }
  .post { white-space: pre-wrap; font-size: 15.5px; line-height: 1.6; padding: 18px 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--sheet); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .hist { margin-top: 28px; color: var(--ink-3); font-size: 13.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar"><div class="brand">오늘의 카드</div><div class="tools"><a class="btn" href="./">목록</a></div></header>
  <div class="card-wrap">
    <p id="when" style="color:var(--ink-3);font-size:13.5px"></p>
    <div class="post" id="post">불러오는 중…</div>
    <div class="actions">
      <button class="btn" id="copy" type="button">텍스트 복사</button>
      <button class="btn" id="share" type="button" hidden>공유…</button>
      <a class="btn" id="open" href="#" target="_blank" rel="noopener">에피소드 열기</a>
    </div>
    <p class="hist">매일 07:00 KST에 새 에피소드로 갱신됩니다. 복사한 텍스트를 카톡방에 붙이면 링크 미리보기가 붙습니다.</p>
  </div>
</div>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  fetch('data/daily/latest.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(card => {
    $('#post').textContent = card.text;
    $('#when').textContent = card.date_kst + ' · ' + card.show.name;
    $('#open').href = card.link;
    $('#copy').addEventListener('click', () => {
      (navigator.clipboard ? navigator.clipboard.writeText(card.text) : Promise.reject()).then(() => { $('#copy').textContent = '복사됨 ✓'; setTimeout(() => $('#copy').textContent = '텍스트 복사', 1500); },
        () => { const r = document.createRange(); r.selectNodeContents($('#post')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
    });
    if (navigator.share) { $('#share').hidden = false; $('#share').addEventListener('click', () => navigator.share({ text: card.text }).catch(() => {})); }
  }).catch(e => { $('#post').textContent = '아직 오늘의 카드가 없습니다 (' + e.message + ').'; });
})();
</script>
</body>
</html>
