<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Podcast Study</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='26' height='16' rx='3' fill='%23ffe45e'/%3E%3Crect x='7' y='14' width='18' height='4' rx='2' fill='%2315213a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">Podcast Study <small id="count"></small></div>
    <div class="tools">
      <button class="iconbtn" id="themeBtn" title="테마 전환" aria-label="테마 전환">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A5.5 5.5 0 0 1 13.4 3.1C13 3 12.5 3 12 3z"/></svg>
      </button>
    </div>
  </header>

  <section class="lead" id="lead" hidden></section>

  <div class="filters" id="filters" role="group" aria-label="프로그램 필터"></div>
  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" hidden>
    아직 에피소드가 없습니다. GitHub Actions의 <code>Update podcast study</code> 워크플로를 한 번 실행하면 최신 에피소드가 여기에 쌓입니다.
  </div>

  <footer class="foot" id="foot"></footer>
</div>

<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const fmt = (sec) => { sec = Math.round(sec || 0); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); };
  const dateKo = (iso) => { const d = new Date(iso); return d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }); };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const progress = (id) => { try { return JSON.parse(localStorage.getItem('prog:' + id) || 'null'); } catch (e) { return null; } };

  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next; try { localStorage.setItem('theme', next); } catch (e) {}
  });

  let data, activeShow = (() => { try { return localStorage.getItem('filter') || 'all'; } catch (e) { return 'all'; } })();

  function render() {
    const shows = Object.fromEntries(data.shows.map(s => [s.slug, s]));
    const eps = data.episodes.filter(e => activeShow === 'all' || e.show === activeShow);
    $('#count').textContent = data.episodes.length ? `${data.episodes.length}편` : '';

    // filters
    const f = $('#filters'); f.innerHTML = '';
    const mk = (slug, label, color) => {
      const b = document.createElement('button'); b.className = 'chip'; b.type = 'button';
      b.setAttribute('aria-pressed', String(activeShow === slug));
      b.innerHTML = (color ? `<span class="dot" style="--show:${esc(color)}"></span>` : '') + esc(label);
      b.addEventListener('click', () => { activeShow = slug; try { localStorage.setItem('filter', slug); } catch (e) {} render(); });
      f.appendChild(b);
    };
    mk('all', '전체');
    data.shows.forEach(s => mk(s.slug, s.name, s.color));

    // lead: the newest unfinished episode
    const lead = $('#lead');
    const pick = eps.find(e => !(progress(e.id)?.done)) || eps[0];
    if (pick) {
      const sh = shows[pick.show] || {};
      const p = progress(pick.id);
      lead.hidden = false;
      lead.innerHTML = `
        <div class="kicker"><span class="chip"><span class="dot" style="--show:${esc(sh.color)}"></span>${esc(sh.name || pick.show)}</span>
          <span>${esc(dateKo(pick.published_at))}</span><span>${fmt(pick.duration_sec)}</span>${pick.cefr ? `<span class="badge">${esc(pick.cefr)}</span>` : ''}
          ${pick.demo ? '<span class="badge demo">DEMO</span>' : ''}${pick.mock ? '<span class="badge mock">mock</span>' : ''}</div>
        <h1><a href="episode.html?id=${encodeURIComponent(pick.id)}">${esc(pick.title)}</a></h1>
        <p class="one">${esc(pick.one_liner_ko)}</p>
        <div class="cta"><a class="btn" href="episode.html?id=${encodeURIComponent(pick.id)}">${p && p.pos > 20 ? '이어서 듣기 ' + fmt(p.pos) : '듣기 시작'}</a>
          <span style="color:var(--ink-3);font-size:13px">표현 ${pick.expressions}개 · 단어 ${pick.words ? pick.words.toLocaleString() : '-'}</span></div>`;
    } else { lead.hidden = true; }

    // list
    const list = $('#list'); list.innerHTML = '';
    $('#empty').hidden = eps.length > 0;
    eps.forEach(e => {
      const sh = shows[e.show] || {}; const p = progress(e.id);
      const li = document.createElement('li'); li.className = 'row';
      li.innerHTML = `
        <div class="meta"><span class="chip"><span class="dot" style="--show:${esc(sh.color)}"></span>${esc(sh.name || e.show)}</span>
          <span>${esc(dateKo(e.published_at))}</span><span>${fmt(e.duration_sec)}</span>
          ${e.cefr ? `<span class="badge">${esc(e.cefr)}</span>` : ''}${e.demo ? '<span class="badge demo">DEMO</span>' : ''}${e.mock ? '<span class="badge mock">mock</span>' : ''}
          ${p?.done ? '<span class="done">완료</span>' : (p && p.pos > 20 ? `<span>${fmt(p.pos)}까지 들음</span>` : '')}</div>
        <h2><a href="episode.html?id=${encodeURIComponent(e.id)}">${esc(e.title)}</a></h2>
        <span style="color:var(--ink-3);font-size:13px;white-space:nowrap">표현 ${e.expressions}</span>
        <p class="one">${esc(e.one_liner_ko)}</p>
        ${e.tags?.length ? `<div class="tags">${e.tags.slice(0, 6).map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}`;
      list.appendChild(li);
    });
    $('#foot').textContent = data.generated_at ? `마지막 갱신 ${new Date(data.generated_at).toLocaleString('ko-KR')} · 자막·음원은 각 팟캐스트 발행사의 공개 RSS에서 가져옵니다.` : '';
  }

  fetch('data/index.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { data = d; render(); })
    .catch(err => { $('#empty').hidden = false; $('#empty').innerHTML = `목록을 불러오지 못했습니다 (${esc(err.message)}). <code>docs/data/index.json</code>이 있는지 확인하세요.`; });
})();
</script>
</body>
</html>
