name: Probe — feed audio over https
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          from pipeline.util import http_session, http_get_text
          from pipeline.feeds import parse_feed
          from pipeline import webtranscript as W
          from pipeline.app_worker import show_config
          import requests
          s = http_session()
          row = {"id": "x", "title": "6ME", "feed_url": "https://podcasts.files.bbci.co.uk/p02pc9tn.rss", "path": "web", "parser": "bbc_le",
                 "page_url": "https://www.bbc.co.uk/learningenglish/english/features/6-minute-english_{year}/ep-{yymmdd}"}
          cfg = show_config(row)
          _, eps = parse_feed(http_get_text(s, row["feed_url"]))
          ep = eps[0]
          page = W.resolve_page_url(s, cfg, ep); html = W.fetch_page(s, page)
          link = W.find_audio_link(html, page)
          print(f"::notice::page={page} link={link}")
          for name, url in (("page mp3", link), ("feed", ep.audio_url)):
              for ua in ("okhttp/4.12.0", "ExoPlayerLib/2.19.1", None):
                  h = {"User-Agent": ua} if ua else {"User-Agent": ""}
                  try:
                      r = requests.get(url, headers=h, stream=True, timeout=30, allow_redirects=True)
                      print(f"::notice::{name} ua={ua} -> {r.status_code} {r.headers.get('content-type')} {r.url[:80]}")
                  except Exception as e:
                      print(f"::notice::{name} ua={ua} ERR {e}"[:200])
          PY
