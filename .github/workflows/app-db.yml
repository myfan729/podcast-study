name: App database (migrations + catalog seed)
on:
  push:
    paths: ["supabase/migrations/**", "tools/catalog/catalog.json"]
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations (each file once; recorded in public._migrations)
        if: env.SUPABASE_DB_URL != ''
        run: |
          sudo apt-get install -y -qq postgresql-client > /dev/null
          # surface psql errors as annotations (readable without the log); secrets are masked by GitHub
          trap 'if [ -s /tmp/err ]; then echo "::error::$(tail -c 600 /tmp/err | tr "\n" " " | sed -E "s#postgres(ql)?://[^ ]*#<db-url>#g")"; fi' EXIT
          exec 2> >(tee /tmp/err >&2)
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "create table if not exists public._migrations (name text primary key, applied_at timestamptz default now())"
          for f in $(ls supabase/migrations/*.sql | sort); do
            n=$(basename "$f")
            if [ "$(psql "$SUPABASE_DB_URL" -tAc "select 1 from public._migrations where name='$n'")" != "1" ]; then
              echo "applying $n"
              psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -1 -f "$f"
              psql "$SUPABASE_DB_URL" -c "insert into public._migrations(name) values ('$n')"
            fi
          done
      - name: Keep the translation key in Vault (tap-to-translate)
        if: env.SUPABASE_DB_URL != ''
        env:
          AKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$AKEY" ] || exit 0
          # passed as a psql variable (masked by GitHub, never echoed)
          printf '%s\n' \
            "select vault.create_secret(:'k', 'anthropic_api_key') where not exists (select 1 from vault.secrets where name = 'anthropic_api_key');" \
            "select vault.update_secret(id, :'k') from vault.secrets where name = 'anthropic_api_key';" \
            | psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -v k="$AKEY" > /dev/null 2>/tmp/verr || { echo "::error::vault: $(tail -c 300 /tmp/verr)"; exit 1; }
      - uses: actions/setup-python@v5
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_KEY != ''
        with: { python-version: "3.12" }
      - name: Seed the verified show catalog
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_KEY != '' && hashFiles('tools/catalog/catalog.json') != ''
        run: |
          pip install -q -r requirements.txt
          python -m pipeline.app_worker seed tools/catalog/catalog.json 2> /tmp/seed.log || { echo "::error::$(tail -c 900 /tmp/seed.log | tr '\n' ' ')"; exit 1; }
          echo "::notice::$(grep -E 'seeded|dropped' /tmp/seed.log | tr '\n' ' ' | tail -c 900)"
