name: Probe blog posts
on:
  workflow_dispatch:
  push:
    paths: ["tools/probe_blog.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python tools/probe_blog.py
      - run: |
          git config user.name "podcast-study bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/probe_blog.json && git commit -m "probe: blog posts" && git pull --rebase origin main && git push
