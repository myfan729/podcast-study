name: Update podcast study

on:
  schedule:
    # Every 3 hours. Big Take lands ~20:00–21:30 UTC on weekdays, Think Fast Talk Smart at 13:00 UTC Mon/Thu.
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths-ignore: ["docs/data/**", "state/**"]   # code/config changes trigger a run; the bot's own data commits do not
  workflow_dispatch:
    inputs:
      backfill:
        description: "Episodes per show to process on first run (shows with no history)"
        default: "3"
      max_new:
        description: "Max episodes to process in this run (all shows)"
        default: "8"
      force:
        description: "Re-process an episode whose title/guid contains this text (optional)"
        default: ""
      mock:
        description: "Skip the Claude API (placeholder content) — for plumbing tests"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STUDY_MODEL: ${{ vars.STUDY_MODEL }}          # optional repo variable, default claude-sonnet-5-5
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}  # optional
          IN_MAX_NEW: ${{ github.event.inputs.max_new }}
          IN_BACKFILL: ${{ github.event.inputs.backfill }}
          IN_FORCE: ${{ github.event.inputs.force }}
          IN_MOCK: ${{ github.event.inputs.mock }}
        run: |
          args=(--max-new "${IN_MAX_NEW:-8}")
          if [ -n "$IN_BACKFILL" ]; then args+=(--backfill "$IN_BACKFILL"); fi
          if [ -n "$IN_FORCE" ]; then args+=(--force "$IN_FORCE"); fi
          if [ "$IN_MOCK" = "true" ]; then args+=(--mock); fi
          echo "python -m pipeline ${args[*]}"
          python -m pipeline "${args[@]}"

      - name: Commit results
        run: |
          git config user.name "podcast-study bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/data state
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Report
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Pipeline reported failures — see the 'Run pipeline' step log. State was still committed."
          exit 1
