name: Update podcast study

on:
  schedule:
    # The schedule in config/shows.yaml decides what is made; runs only need to be frequent enough.
    # Big Take lands ~20:00–21:30 UTC (05:00–06:30 KST) for the 07:00 KST post, Daybreak ~09:40 UTC,
    # Short Stuff 09:00 UTC on Wednesdays (for 21:00 KST). GitHub skips some scheduled runs: extra chances.
    - cron: "17 */2 * * *"       # every 2 h (odd hours KST)
    - cron: "47 20 * * *"        # 05:47 KST
    - cron: "37 21 * * *"        # 06:37 KST
    - cron: "47 10 * * *"        # 19:47 KST
  push:
    branches: [main]
    paths-ignore: ["docs/data/**", "state/**"]   # code/config changes trigger a run; the bot's own data commits do not
  workflow_dispatch:
    inputs:
      backfill:
        description: "Episodes per show to process on first run (shows with no history)"
        default: "3"
      max_new:
        description: "Max episodes to process in this run (all shows)"
        default: "8"
      force:
        description: "Re-process an episode whose title/guid contains this text (optional)"
        default: ""
      retime:
        description: "Re-align timestamps of a web-transcript episode whose title contains this text (study pack kept, no API cost)"
        default: ""
      mock:
        description: "Skip the Claude API (placeholder content) — for plumbing tests"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base.en-v1

      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -r requirements.txt -r requirements-sync.txt

      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}      # private episode list + unguessable episode links
          STUDY_MODEL: ${{ vars.STUDY_MODEL }}          # optional repo variable, default claude-sonnet-5-5
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}  # optional
          IN_MAX_NEW: ${{ github.event.inputs.max_new }}
          IN_BACKFILL: ${{ github.event.inputs.backfill }}
          IN_FORCE: ${{ github.event.inputs.force }}
          IN_RETIME: ${{ github.event.inputs.retime }}
          IN_MOCK: ${{ github.event.inputs.mock }}
        run: |
          args=(--max-new "${IN_MAX_NEW:-8}")
          if [ -n "$IN_BACKFILL" ]; then args+=(--backfill "$IN_BACKFILL"); fi
          if [ -n "$IN_FORCE" ]; then args+=(--force "$IN_FORCE"); fi
          if [ -n "$IN_RETIME" ]; then args+=(--retime "$IN_RETIME"); fi
          if [ "$IN_MOCK" = "true" ]; then args+=(--mock); fi
          echo "python -m pipeline ${args[*]}"
          python -m pipeline "${args[@]}"

      - name: Blog links (words/expressions that already have a post on the owner's blog)
        continue-on-error: true
        run: python -m pipeline.blog_index

      - name: Chat posts (queue the episodes made for the next morning/evening post)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.daily

      - name: Build sync references (ad-aware auto sync)
        id: sync
        continue-on-error: true
        env:
          IN_MOCK: ${{ github.event.inputs.mock }}
        run: |
          if [ "$IN_MOCK" = "true" ]; then echo "mock run: skipping sync"; exit 0; fi
          python -m pipeline.sync --max 8

      - name: Commit results
        run: |
          git config user.name "podcast-study bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/data state
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "update $(date -u +'%Y-%m-%d %H:%M UTC')"
            # another workflow (probe/verify, or a run that overlapped) may have pushed meanwhile: rebase, keeping
            # this run's generated files where they conflict, and retry the push a few times
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 7))
            done
          fi

      - name: Report
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Pipeline reported failures — see the 'Run pipeline' step log. State was still committed."
          exit 1
