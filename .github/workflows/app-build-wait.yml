name: App build — wait for result
on:
  workflow_dispatch:
    inputs:
      build_id: { description: "EAS build id", required: true }
jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run: { working-directory: app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: |
          set +e; miss=0
          for i in $(seq 1 85); do
            npx -y eas-cli@latest build:list --platform android --limit 5 --json --non-interactive > /tmp/l.json 2>/tmp/b.err; node -e "const l=require('/tmp/l.json'); const id='${{ inputs.build_id }}'; const b=l.find(x=>x.id===id)||l[0]; require('fs').writeFileSync('/tmp/b.json', JSON.stringify(b))" 2>>/tmp/b.err
            st=$(node -e "try{console.log(require('/tmp/b.json').status||'')}catch(e){console.log('')}")
            if [ -z "$st" ]; then miss=$((miss+1)); [ $miss -ge 3 ] && exit 1; fi
            [ -n "$st" ] || echo "::warning::eas says: $(head -c 600 /tmp/l.json | tr '\n' ' ')"
            echo "status: $st"
            case "$st" in FINISHED|ERRORED|CANCELED) break;; esac
            sleep 60
          done
          node -e "const b=require('/tmp/b.json'); console.log('::notice title=build '+b.status+'::'+((b.artifacts&&(b.artifacts.applicationArchiveUrl||b.artifacts.buildUrl))||'')+' '+((b.error&&b.error.message)||''))"
