name: Replay the posting schedule
on:
  workflow_dispatch:
  push:
    paths: ["tools/simulate_schedule.py"]
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python tools/simulate_schedule.py --days 9 > /tmp/replay.log 2>&1; tail -80 /tmp/replay.log
      - run: |
          git config user.name "podcast-study bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/simulate_schedule.txt && git commit -m "replay: posting schedule" && for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
