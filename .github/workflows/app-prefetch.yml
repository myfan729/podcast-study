name: App prefetch (refresh feeds, pre-build new episodes of followed shows)
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
concurrency:
  group: app-prefetch
  cancel-in-progress: false
jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STUDY_MODEL: ${{ vars.STUDY_MODEL }}
      TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-base.en-v1 }
      - run: |
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          pip install -r requirements.txt
      - name: Refresh show feeds
        run: python -m pipeline.app_worker refresh
      - name: Mark new episodes of followed shows
        run: python -m pipeline.app_worker prefetch
      - name: Build them
        run: python -m pipeline.app_worker process --status prefetch --max 20
      - name: Audio sync
        run: |
          pip install -r requirements-sync.txt
          python -m pipeline.app_worker sync --max 20
