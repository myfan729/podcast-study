name: App intros (Korean one-liners for shows/episodes)
on:
  workflow_dispatch:
jobs:
  intros:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pipeline.app_worker intros > /tmp/i.log 2>&1 || { echo "::error::$(tail -c 900 /tmp/i.log | tr '\n' ' ')"; exit 1; }; tail -3 /tmp/i.log
      - name: Pronunciation (IPA) for words in packs made before it existed
        run: python -m pipeline.app_worker ipa > /tmp/p.log 2>&1 || { echo "::error::$(tail -c 900 /tmp/p.log | tr '\n' ' ')"; exit 1; }; tail -2 /tmp/p.log
