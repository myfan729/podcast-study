name: Chat posts

on:
  schedule:
    # queue.json is normally written right after each pipeline run; these are a safety net around the posting times
    - cron: "7,37 20-23 * * *"   # 05:07–08:37 KST every 30 min
    - cron: "7,37 7-9 * * *"     # 16:07–18:37 KST every 30 min
  push:
    paths: [".github/workflows/daily.yml", "pipeline/daily.py"]   # also run right after the poster itself changes
  repository_dispatch:
    types: [daily]              # fired on time by the database (pg_cron), since GitHub drops scheduled runs
  workflow_dispatch:
    inputs:
      force:
        description: "Post this episode (id/title substring) right now, even if it was posted before"
        default: ""

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Queue the posts that are ready
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IN_FORCE: ${{ github.event.inputs.force }}
        run: |
          args=()
          if [ -n "$IN_FORCE" ]; then args+=(--force "$IN_FORCE"); fi
          python -m pipeline.daily "${args[@]}"
      - name: Commit
        run: |
          git config user.name "podcast-study bot"; git config user.email "actions@users.noreply.github.com"
          git add -A docs/data/daily state/posted.json
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "daily post $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push; then break; fi
              git rebase --abort 2>/dev/null || true; sleep $((i * 7))
            done
          fi
