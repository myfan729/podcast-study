name: App e2e — web-page transcripts
on:
  workflow_dispatch:
    inputs:
      check_only: { default: "0" }
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CHECK_ONLY: ${{ inputs.check_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q -r requirements.txt -r requirements-sync.txt && npm i --no-save --no-audit --no-fund typescript@5.6.3 && (cd app && npm i --no-save --no-audit --no-fund htmlparser2@9.1.0 domutils@3.1.0 domhandler@5.0.3 entities@4.5.0)
      - run: PYTHONPATH=. python tools/web_e2e.py 2>/tmp/e || { echo "::error::$(tail -c 1500 /tmp/e | tr "\n" " ")"; exit 1; }
