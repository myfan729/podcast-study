name: Probe NPR
on:
  workflow_dispatch:
  push:
    paths: ["tools/probe_npr.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/probe_npr.py
      - run: |
          git config user.name "podcast-study bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/probe_npr.json tools/npr_samples && git commit -m "probe: NPR" && for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
