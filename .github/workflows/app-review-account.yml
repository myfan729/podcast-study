name: App store-review account
on:
  workflow_dispatch:
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python tools/review_account.py 2>&1 | tail -3 | while read l; do echo "::notice::$l"; done
