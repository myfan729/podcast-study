name: Scan — podcast licences
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q aiohttp requests
      - name: Scan
        run: |
          python3 tools/catalog/license_scan_itunes.py tools/catalog/license_scan.json > /tmp/scan.log 2>&1; rc=$?
          echo "::notice title=scan log (rc $rc)::$(tail -c 1500 /tmp/scan.log | tr '\n' ' ')"
          exit $rc
      - name: Save
        run: |
          git config user.name "podcast-study bot" && git config user.email "actions@users.noreply.github.com"
          git add tools/catalog/license_scan.json && git commit -qm "license scan results" && git pull -q --rebase && git push -q
