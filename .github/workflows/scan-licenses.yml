name: Scan — podcast licences (Podcast Index dump)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h /
      - uses: actions/checkout@v4
      - run: pip install -q aiohttp
      - name: Download dump
        run: |
          cd /mnt 2>/dev/null && sudo chmod 777 /mnt || cd ~
          curl -sSL -o dump.tgz https://public.podcastindex.org/podcastindex_feeds.db.tgz && ls -la dump.tgz
          tar xzf dump.tgz && rm dump.tgz && ls -la
          echo "DBDIR=$PWD" >> $GITHUB_ENV
      - name: Scan
        run: |
          echo "::notice title=files::$(ls -la $DBDIR | tr '\n' ' ' | head -c 900)"
          db=$(find $DBDIR -maxdepth 2 -name '*.db' | head -1)
          python3 tools/catalog/license_scan.py "$db" tools/catalog/license_scan.json > /tmp/scan.log 2>&1; rc=$?
          echo "::notice title=scan log (rc $rc)::$(tail -c 2500 /tmp/scan.log | tr '\n' ' ')"
          exit $rc
      - name: Save
        run: |
          git config user.name "podcast-study bot" && git config user.email "actions@users.noreply.github.com"
          git add tools/catalog/license_scan.json && git commit -qm "license scan results" && git pull -q --rebase && git push -q
