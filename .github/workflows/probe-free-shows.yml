name: Probe — public-domain / CC shows
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: pip install -q requests
      - run: |
          python3 - <<'PY'
          import re, requests
          from email.utils import parsedate_to_datetime
          UA = {"User-Agent": "Mozilla/5.0 (podcast app)"}
          terms = ["Office for National Statistics podcast Statistically Speaking", "Bank of England podcast", "UK Parliament podcast", "House of Commons Library podcast",
                   "House of Lords Library podcast", "Met Office podcast", "UK Space Agency podcast", "GOV.UK podcast", "Civil Service podcast UK",
                   "National Archives UK On the Record podcast", "British Library podcast", "Natural History Museum podcast", "Science Museum podcast",
                   "UKRI podcast", "NHS podcast", "Reserve Bank of Australia podcast", "CSIRO podcast", "Australian Parliament podcast",
                   "Australian Antarctic Division podcast", "Australian Bureau of Statistics podcast", "Geoscience Australia podcast", "Department of Foreign Affairs and Trade Australia podcast",
                   "Australian War Memorial podcast", "National Library of Australia podcast", "National Archives of Australia podcast", "Questacon podcast",
                   "Reserve Bank of New Zealand podcast", "Te Papa podcast", "NZ Treasury podcast", "Bank of Canada podcast",
                   "Library of Congress podcast", "NIH Clinical Center podcast", "NIST podcast", "NSF Discovery Files", "Smithsonian NMNH podcast",
                   "State Department podcast", "FDA podcast", "USDA podcast", "Census Bureau podcast", "Federal Reserve Board podcast"]
          s = requests.Session(); out = []
          for t in terms:
              try:
                  r = s.get("https://itunes.apple.com/search", params={"term": t, "entity": "podcast", "limit": 3}, headers=UA, timeout=20).json()["results"]
                  for h in r[:2]:
                      x = s.get(h["feedUrl"], headers=UA, timeout=40).text
                      ch = x.split("<item")[0]; items = x.split("<item")[1:]
                      cp = re.search(r"<copyright>(.*?)</copyright>", ch, re.S); lic = re.search(r"<podcast:license[^>]*>(.*?)<|<podcast:license[^>]*url=\"([^\"]+)", ch, re.S)
                      cc = re.search(r"creativecommons\.org/[^\s\"<]+|public domain|CC[- ]BY[^\s<,.]*", x[:200000], re.I)
                      tx = sum(1 for it in items[:10] if "<podcast:transcript" in it)
                      last = re.search(r"<pubDate>(.*?)</pubDate>", items[0]) if items else None
                      d = parsedate_to_datetime(last.group(1)).date().isoformat() if last else "-"
                      out.append(f"{t} => {h['collectionName']} | {h.get('artistName')} | last={d} n={len(items)} | ©={(cp.group(1).strip()[:60] if cp else '-')} | lic={(lic.group(0)[:80] if lic else '-')} | cc={(cc.group(0)[:60] if cc else '-')} | tx={tx}/10 | {h['feedUrl'][:90]}")
              except Exception as e:
                  out.append(f"{t} ERR {e}")
          for i in range(0, len(out), 4):
              print("::notice title=batch %d::" % i + " ### ".join(out[i:i+4]))
          PY
