name: Transcript parity (app TS vs pipeline)
on:
  workflow_dispatch: {}
  push: { paths: ["app/lib/transcript.ts", "app/lib/webTranscript.ts", "pipeline/transcript.py", "pipeline/webtranscript.py", "pipeline/align.py", "tools/parity/**"] }
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -q -r requirements.txt && npm i --no-save --no-audit --no-fund typescript@5.6.3 && (cd app && npm i --no-save --no-audit --no-fund htmlparser2@9.1.0 domutils@3.1.0 domhandler@5.0.3 entities@4.5.0)
      - run: PYTHONPATH=. python tools/parity/run.py 2>/tmp/e || { echo "::error::$(tail -c 1500 /tmp/e | tr "\n" " ")"; exit 1; }
      - if: always()
        run: PYTHONPATH=. python tools/parity/web_run.py 2>/tmp/e2 || { echo "::error::$(tail -c 1500 /tmp/e2 | tr "\n" " ")"; exit 1; }
