name: Probe NPR transcripts (app failures)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && { PYTHONPATH=. python tools/probe_npr_app.py > /tmp/p.log 2>&1 || echo "::error::$(tail -c 800 /tmp/p.log | tr "\n" " ")"; }; cat /tmp/p.log | tail -5
      - run: |
          git config user.name "podcast-study bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/probe_npr_app.json; git add tools/npr_samples 2>/dev/null; git commit -m "probe: npr app" && for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
