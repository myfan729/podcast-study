name: Probe audio URLs
on:
  workflow_dispatch:
  push:
    paths: ["tools/probe_audio.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base.en-v1
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -r requirements.txt -r requirements-sync.txt
      - run: python tools/probe_audio.py
      - run: |
          git config user.name "podcast-study bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/probe_result.json && git commit -m "probe: audio URL results" && git pull --rebase origin main && git push
