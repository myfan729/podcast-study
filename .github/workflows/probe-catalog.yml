name: Probe show catalog
on:
  workflow_dispatch:
  push:
    paths: ["tools/catalog/candidates.txt", "tools/catalog/probe_catalog.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/catalog/probe_catalog.py
      - if: always()
        run: |
          git config user.name "podcast-study bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/catalog/probe_catalog.json && git commit -m "probe: show catalog" && for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
