name: App build (Android, EAS)
# Needs repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
# preview    → .apk to install straight on a phone
# production → .aab to upload to Google Play
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "preview (apk for your phone) or production (aab for Play)"
        type: choice
        options: [preview, production]
        default: preview
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run: { working-directory: app }
    steps:
      - name: Check the Expo token
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::EXPO_TOKEN secret is missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Who am I
        run: echo "::notice title=expo account::$(npx -y eas-cli@latest whoami 2>/dev/null | grep -v '^npm' | head -1)"
      - name: Link the EAS project (first run only)
        run: |
          set +e
          if grep -q '"projectId"' app.json; then echo "already linked"; exit 0; fi
          npx -y eas-cli@latest init --non-interactive --force > /tmp/init.log 2>&1; rc=$?
          echo "::notice title=eas init (exit $rc)::$(grep -v '^npm' /tmp/init.log | tail -c 700 | tr '\n' ' ')"
          [ $rc -eq 0 ] || exit 1
          git -C .. diff --stat
          if ! grep -q '"projectId"' app.json; then echo "::error::eas init did not write extra.eas.projectId into app.json"; exit 1; fi
          cd .. && git config user.name "podcast-study bot" && git config user.email "actions@users.noreply.github.com"
          git add app/app.json && git commit -qm "app: link EAS project" && git pull -q --rebase origin main && git push -q \
            || { echo "::error::could not push the linked app.json"; exit 1; }
      - name: Start the build
        run: |
          npx -y eas-cli@latest build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait --json > /tmp/build.json 2> /tmp/build.err || {
            echo "::error::$(tail -c 600 /tmp/build.err | tr '\n' ' ')"; exit 1; }
          url=$(node -e "const b=require('/tmp/build.json'); const x=Array.isArray(b)?b[0]:b; const o=x.project&&x.project.ownerAccount&&x.project.ownerAccount.name; console.log(o ? 'https://expo.dev/accounts/'+o+'/projects/'+x.project.slug+'/builds/'+x.id : 'build id '+x.id)")
          echo "::notice title=build started (${{ inputs.profile }})::$url"
