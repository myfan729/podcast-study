name: Translate A/B (Sonnet vs Haiku)
on:
  workflow_dispatch:
    inputs:
      file: { required: true }
      start: { default: "20" }
      n: { default: "30" }
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: PYTHONPATH=. python tools/translate_ab.py "${{ inputs.file }}" ${{ inputs.start }} ${{ inputs.n }} 2>/tmp/err; rc=$?; [ $rc -eq 0 ] || { echo "::error::$(tail -c 1500 /tmp/err | tr "\n" " ")"; exit 1; }
