name: App — recent failed episodes (diagnostics)
on:
  workflow_dispatch:
    inputs:
      retry: { description: "re-queue failed episodes (attempts reset)", type: boolean, default: false }
      rebuild_show: { description: "rebuild all built episodes of the show with this exact title", type: string, default: "" }
jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      REBUILD: ${{ inputs.rebuild_show }}
    steps:
      - run: |
          sudo apt-get install -y -qq postgresql-client > /dev/null
          if [ "${{ inputs.retry }}" = "true" ]; then
            n=$(psql "$SUPABASE_DB_URL" -tA -c "with u as (update public.episodes set status='queued', attempts=0, error=null, requested_at=now() where status='failed' returning 1) select count(*) from u" 2>&1 | sed -E "s#postgres(ql)?://[^ ]*#<db-url>#g")
            echo "::notice title=re-queued::$n"
          fi
          if [ -n "$REBUILD" ]; then
            n=$(echo "with u as (update public.episodes e set status='queued', attempts=0, error=null, requested_at=now(), sync_path=null from public.shows s where s.id=e.show_id and s.title = :'t' and e.status in ('ready','failed','processing') returning 1) select count(*) from u;" | psql "$SUPABASE_DB_URL" -tA -v t="$REBUILD" 2>&1 | sed -E "s#postgres(ql)?://[^ ]*#<db-url>#g")
            echo "::notice title=rebuild queued::$n"
          fi
          psql "$SUPABASE_DB_URL" -tA -F ' | ' -c "select s.title, e.title, e.status, e.attempts, left(coalesce(e.error,''), 400)
            from public.episodes e join public.shows s on s.id = e.show_id
            where e.status in ('failed','no_transcript') or e.error is not null
            order by coalesce(e.requested_at, e.published_at) desc limit 25" 2>&1 | sed -E "s#postgres(ql)?://[^ ]*#<db-url>#g" |
          while IFS= read -r l; do echo "::notice::$l"; done
          psql "$SUPABASE_DB_URL" -tA -F ' | ' -c "select r.created_at::text, s.title, e.title, r.ok, left(coalesce(r.error,''),200),
              (select string_agg(round((x->>'a')::numeric - (x->>'c')::numeric, 1)::text || case when (x->>'ok')::boolean then '' else '?' end, ',') from jsonb_array_elements(r.report->'refs') x),
              left(coalesce(r.anchors::text,''),300)
            from public.sync_reports r join public.episodes e on e.id=r.episode_id join public.shows s on s.id=e.show_id order by r.created_at desc limit 4" 2>&1 | sed -E "s#postgres(ql)?://[^ ]*#<db-url>#g" | while IFS= read -r l; do echo "::notice title=sync report::$l"; done
          psql "$SUPABASE_DB_URL" -tA -F ' | ' -c "select s.title, count(*) filter (where e.has_transcript) as with_tr, count(*) filter (where not e.has_transcript) as no_tr,
              count(*) filter (where e.status='ready') as ready, count(*) filter (where e.status='failed') as failed, count(*) filter (where e.status in ('queued','prefetch','processing')) as pending,
              count(*) filter (where e.status='ready' and e.sync_path is null) as ready_nosync
            from public.episodes e join public.shows s on s.id=e.show_id
            where s.title ilike any (array['%6 minute%','%sbs learn%','%big take%','%up first%'])
            group by s.title" 2>&1 | sed -E "s#postgres(ql)?://[^ ]*#<db-url>#g" | while IFS= read -r l; do echo "::notice title=show stats (title|with transcript|no transcript|ready|failed|pending|ready w/o sync)::$l"; done
      - name: Build time by episode length (requested → ready)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -tA -c "select string_agg(x, ' ; ') from (select s.path || ' ' || round(e.duration_sec/60.0) || 'm→' || round(extract(epoch from e.ready_at - e.requested_at)/60.0, 1) || 'm' as x
            from public.episodes e join public.shows s on s.id=e.show_id
            where e.ready_at is not null and e.requested_at is not null and e.ready_at > e.requested_at and e.ready_at > now() - interval '3 days'
            order by e.ready_at desc limit 60) t" 2>&1 | sed -E "s#postgres(ql)?://[^ ]*#<db-url>#g" | while IFS= read -r l; do echo "::notice title=build times::$l"; done
