name: App — recent failed episodes (diagnostics)
on:
  workflow_dispatch:
    inputs:
      retry: { description: "re-queue failed episodes (attempts reset)", type: boolean, default: false }
jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - run: |
          sudo apt-get install -y -qq postgresql-client > /dev/null
          if [ "${{ inputs.retry }}" = "true" ]; then
            n=$(psql "$SUPABASE_DB_URL" -tA -c "with u as (update public.episodes set status='queued', attempts=0, error=null, requested_at=now() where status='failed' returning 1) select count(*) from u" 2>&1 | sed -E "s#postgres(ql)?://[^ ]*#<db-url>#g")
            echo "::notice title=re-queued::$n"
          fi
          psql "$SUPABASE_DB_URL" -tA -F ' | ' -c "select s.title, e.title, e.status, e.attempts, left(coalesce(e.error,''), 400)
            from public.episodes e join public.shows s on s.id = e.show_id
            where e.status in ('failed','no_transcript') or e.error is not null
            order by coalesce(e.requested_at, e.published_at) desc limit 25" 2>&1 | sed -E "s#postgres(ql)?://[^ ]*#<db-url>#g" |
          while IFS= read -r l; do echo "::notice::$l"; done
          psql "$SUPABASE_DB_URL" -tA -F ' | ' -c "select r.created_at::text, e.title, r.ok, left(coalesce(r.error,''),120), left(coalesce(r.anchors::text,''),200), left(coalesce(r.report::text,''),900)
            from public.sync_reports r join public.episodes e on e.id=r.episode_id order by r.created_at desc limit 6" 2>&1 | sed -E "s#postgres(ql)?://[^ ]*#<db-url>#g" | while IFS= read -r l; do echo "::notice title=sync report::$l"; done
          psql "$SUPABASE_DB_URL" -tA -F ' | ' -c "select s.title, count(*) filter (where e.has_transcript) as with_tr, count(*) filter (where not e.has_transcript) as no_tr,
              count(*) filter (where e.status='ready') as ready, count(*) filter (where e.status='failed') as failed, count(*) filter (where e.status in ('queued','prefetch','processing')) as pending,
              count(*) filter (where e.status='ready' and e.sync_path is null) as ready_nosync
            from public.episodes e join public.shows s on s.id=e.show_id
            where s.title ilike any (array['%6 minute%','%sbs learn%','%big take%','%up first%'])
            group by s.title" 2>&1 | sed -E "s#postgres(ql)?://[^ ]*#<db-url>#g" | while IFS= read -r l; do echo "::notice title=show stats (title|with transcript|no transcript|ready|failed|pending|ready w/o sync)::$l"; done
