name: Verify show catalog end to end
on:
  workflow_dispatch:
  push:
    paths: ["tools/catalog/verify_catalog.py", "tools/catalog/catalog.json"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-base.en-v1 }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -r requirements.txt -r requirements-sync.txt
      - run: python tools/catalog/verify_catalog.py ${{ matrix.shard }} 6
      - uses: actions/upload-artifact@v4
        with: { name: "verify-${{ matrix.shard }}", path: tools/catalog/verify/${{ matrix.shard }}.json }
  collect:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: tools/catalog/verify, merge-multiple: true }
      - run: |
          git config user.name "podcast-study bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/catalog/verify && git commit -m "verify: show catalog" && for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
