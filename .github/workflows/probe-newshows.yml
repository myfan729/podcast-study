name: Probe new shows (BBC Learning English, ABC/SBS)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python tools/probe_newshows.py > /tmp/p.log 2>&1 || echo "::error::$(tail -c 800 /tmp/p.log | tr '\n' ' ')"
      - run: |
          git config user.name "podcast-study bot"; git config user.email "actions@users.noreply.github.com"
          git add -A tools/probe_newshows.json tools/probe_samples || true
          git commit -m "probe: new shows" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep 7; done
