name: Probe schedule candidates
on:
  workflow_dispatch:
  push:
    paths: ["tools/probe_slots.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/probe_slots.py
      - run: |
          git config user.name "podcast-study bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/probe_slots.json && git commit -m "probe: schedule candidates" && git pull --rebase origin main && git push
