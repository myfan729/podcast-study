name: App resync (rebuild audio sync data for ready episodes)
on:
  workflow_dispatch:
jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-base.en-v1 }
      - run: |
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          pip install -r requirements.txt -r requirements-sync.txt
      - run: python -m pipeline.app_worker resync --max 40 > /tmp/r.log 2>&1 || echo "::error::$(tail -c 800 /tmp/r.log | tr '\n' ' ')"; grep -c "synced" /tmp/r.log | xargs -I{} echo "::notice::resynced {} episodes"
